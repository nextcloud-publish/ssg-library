# The local hooks are the lint and test jobs of .github/workflows/ci.yml, run on the host.
# Needs PHP 8.4 or later and `composer install`. Set up once with `pre-commit install`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        # Two trailing spaces are a line break in Markdown.
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-merge-conflict

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: composer-validate
        name: composer validate
        entry: composer validate --strict --no-check-publish
        language: system
        files: ^composer\.json$
        pass_filenames: false

      # composer.lock is not committed, so this audits the installed vendor/.
      - id: composer-audit
        name: composer audit
        entry: composer audit
        language: system
        files: ^composer\.json$
        pass_filenames: false

      - id: php-lint
        name: PHP syntax
        entry: php -l
        language: system
        files: \.php$

      - id: php-cs-fixer
        name: PHP-CS-Fixer
        entry: vendor/bin/php-cs-fixer check --diff
        language: system
        files: ^(src/|tests/|bin/).*\.php$|^\.php-cs-fixer\.dist\.php$
        pass_filenames: false

      - id: phpstan
        name: PHPStan
        entry: vendor/bin/phpstan analyse --no-progress
        language: system
        files: ^(src/|tests/|bin/|composer\.json$|phpstan\.dist\.neon$)
        pass_filenames: false

      - id: phpunit
        name: PHPUnit
        entry: vendor/bin/phpunit
        language: system
        files: ^(src/|tests/|composer\.json$|phpunit\.xml$)
        pass_filenames: false
