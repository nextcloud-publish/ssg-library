name: Release

on:
  push:
    # A release is a tag like 1.2.3, without a leading v.
    tags: ['[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$TAG is not on main"; exit 1; }

      # The section runs from its heading to the next heading or the link list.
      - name: Take the notes from CHANGELOG.md
        run: |
          awk -v tag="$TAG" '
            index($0, "## [" tag "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }
          grep -qxF "[$TAG]: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no link for $TAG"; exit 1; }
          printf '\nSee [CHANGELOG.md](https://github.com/%s/blob/%s/CHANGELOG.md).\n' "$GITHUB_REPOSITORY" "$TAG" >> notes.md

      - name: Create the release
        run: gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
